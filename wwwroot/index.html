<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff5f0;
            font-family: 'Segoe UI', sans-serif;
            color: #5a3e36;
            background-image: radial-gradient(circle, #ffd6c8 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            background: linear-gradient(135deg, #f4a58a, #e8c4e0);
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 12px rgba(244, 165, 138, 0.3);
        }

            header h1 {
                font-size: 2.4rem;
                color: white;
                text-shadow: 1px 2px 4px rgba(0,0,0,0.1);
                letter-spacing: 1px;
            }

            header p {
                color: #fff5f2;
                margin-top: 8px;
                font-size: 1rem;
            }

        .stars {
            font-size: 1.4rem;
            margin-top: 6px;
            letter-spacing: 6px;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        #message {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }

        .msg-success {
            background-color: #d4f4c8;
            color: #3a7a2a;
        }

        .msg-error {
            background-color: #fdd;
            color: #a00;
        }

        .form-section {
            background: linear-gradient(135deg, #ffe8df, #f5e0f7);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 4px 16px rgba(244, 165, 138, 0.2);
            border: 2px dashed #f4b8a5;
        }

            .form-section h2 {
                margin-bottom: 18px;
                color: #c4607a;
                font-size: 1.4rem;
            }

            .form-section input[type="text"],
            .form-section input[type="number"] {
                width: 100%;
                padding: 12px 16px;
                margin-bottom: 12px;
                border: 2px solid #f4b8a5;
                border-radius: 14px;
                font-size: 1rem;
                background-color: white;
                outline: none;
                transition: border 0.2s;
            }

            .form-section input:focus {
                border-color: #e87aa0;
            }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

            .checkbox-row input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #e87aa0;
                cursor: pointer;
            }

            .checkbox-row label {
                font-size: 0.95rem;
                color: #a06070;
                cursor: pointer;
            }

        .btn-add {
            background: linear-gradient(135deg, #f4a58a, #e87aa0);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(232, 122, 160, 0.3);
            transition: transform 0.1s;
        }

            .btn-add:hover {
                transform: scale(1.03);
            }

        .books-section h2 {
            color: #c4607a;
            margin-bottom: 18px;
            font-size: 1.4rem;
        }

        .book-count {
            font-size: 0.9rem;
            color: #c4a0a0;
            margin-bottom: 16px;
        }

        .book-card {
            background: white;
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(244, 165, 138, 0.2);
            border-left: 5px solid #f4a58a;
            transition: transform 0.1s;
        }

            .book-card:hover {
                transform: scale(1.01);
            }

        .book-card-view {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-info h3 {
            font-size: 1.1rem;
            color: #5a3e36;
        }

        .book-info p {
            font-size: 0.9rem;
            color: #a07060;
            margin-top: 5px;
        }

        .book-actions {
            display: flex;
            gap: 10px;
        }

        .btn-delete {
            background: linear-gradient(135deg, #f4a58a, #e8826a);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: transform 0.1s;
        }

            .btn-delete:hover {
                transform: scale(1.05);
            }

        .btn-edit {
            background: linear-gradient(135deg, #c9a8e0, #b08acc);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: transform 0.1s;
        }

            .btn-edit:hover {
                transform: scale(1.05);
            }

        .edit-form {
            display: none;
            margin-top: 14px;
            border-top: 1px dashed #f4b8a5;
            padding-top: 14px;
        }

            .edit-form input[type="text"],
            .edit-form input[type="number"] {
                width: 100%;
                padding: 10px 14px;
                margin-bottom: 10px;
                border: 2px solid #f4b8a5;
                border-radius: 12px;
                font-size: 0.95rem;
                outline: none;
            }

            .edit-form input:focus {
                border-color: #e87aa0;
            }

            .edit-form .checkbox-row {
                margin-bottom: 12px;
            }

        .edit-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-save {
            background: linear-gradient(135deg, #a8e0b8, #70c490);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: transform 0.1s;
        }

            .btn-save:hover {
                transform: scale(1.05);
            }

        .btn-cancel {
            background: #e0d0d0;
            color: #8a6060;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: transform 0.1s;
        }

            .btn-cancel:hover {
                transform: scale(1.05);
            }

        .no-books {
            text-align: center;
            color: #c4a0a0;
            font-size: 1rem;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #c4a0a0;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 My Book Library</h1>
        <p>Keep track of the books you love</p>
        <div class="stars">⭐ 🌸 ⭐ 🌸 ⭐</div>
    </header>

    <main>

        <div id="message"></div>

        <!-- form to add a new book -->
        <div class="form-section">
            <h2>🌸 Add a new book</h2>
            <input type="text" id="title" placeholder="✏️ Title" />
            <input type="text" id="author" placeholder="👤 Author" />
            <input type="number" id="year" placeholder="📅 Year" />
            <div class="checkbox-row">
                <input type="checkbox" id="isRead" />
                <label for="isRead">⭐ I have read this book</label>
            </div>
            <button class="btn-add" onclick="addBook()">Add Book 🌟</button>
        </div>

        <!-- list of books -->
        <div class="books-section">
            <h2>🌈 All Books</h2>
            <p class="book-count" id="book-count"></p>
            <div id="book-list"></div>
        </div>

    </main>

    <footer>
        Made with 🌸 and lots of books
    </footer>

    <script>
        const apiUrl = "http://localhost:5009/api/books";

        // show a message to the user
        function showMessage(text, isError = false) {
            const msg = document.getElementById("message");
            msg.textContent = text;
            msg.className = isError ? "msg-error" : "msg-success";
            msg.style.display = "block";
            setTimeout(() => msg.style.display = "none", 3000);
        }

        // load all books from the API
        async function loadBooks() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Could not load books");
                const books = await response.json();
                displayBooks(books);
            } catch (error) {
                showMessage("Error loading books", true);
            }
        }

        // show books in the DOM
        function displayBooks(books) {
            const list = document.getElementById("book-list");
            const count = document.getElementById("book-count");
            list.innerHTML = "";

            if (books.length === 0) {
                count.textContent = "";
                list.innerHTML = '<p class="no-books">No books yet. Add one above! 📖</p>';
                return;
            }

            count.textContent = `You have ${books.length} book${books.length > 1 ? "s" : ""} 📚`;

            books.forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                        <div class="book-card-view">
                            <div class="book-info">
                                <h3>📖 ${book.title}</h3>
                                <p>${book.author} · ${book.year} · ${book.isRead ? "⭐ Read" : "🌸 Not read yet"}</p>
                            </div>
                            <div class="book-actions">
                                <button class="btn-edit" onclick="toggleEdit(${book.id})">✏️ Edit</button>
                                <button class="btn-delete" onclick="deleteBook(${book.id})">🗑️ Delete</button>
                            </div>
                        </div>
                        <div class="edit-form" id="edit-form-${book.id}">
                            <input type="text" id="edit-title-${book.id}" value="${book.title}" />
                            <input type="text" id="edit-author-${book.id}" value="${book.author}" />
                            <input type="number" id="edit-year-${book.id}" value="${book.year}" />
                            <div class="checkbox-row">
                                <input type="checkbox" id="edit-isRead-${book.id}" ${book.isRead ? "checked" : ""} />
                                <label for="edit-isRead-${book.id}">⭐ I have read this book</label>
                            </div>
                            <div class="edit-buttons">
                                <button class="btn-save" onclick="saveEdit(${book.id})">✅ Save</button>
                                <button class="btn-cancel" onclick="toggleEdit(${book.id})">Cancel</button>
                            </div>
                        </div>
                    `;
                list.appendChild(card);
            });
        }

        // show or hide the edit form on a card
        function toggleEdit(id) {
            const form = document.getElementById(`edit-form-${id}`);
            form.style.display = form.style.display === "block" ? "none" : "block";
        }

        // add a new book
        async function addBook() {
            const title = document.getElementById("title").value.trim();
            const author = document.getElementById("author").value.trim();
            const year = parseInt(document.getElementById("year").value);
            const isRead = document.getElementById("isRead").checked;

            if (!title || !author || !year) {
                showMessage("Please fill in all fields", true);
                return;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, author, year, isRead })
                });

                if (!response.ok) throw new Error("Could not add book");

                showMessage("Book added! 🌟");
                document.getElementById("title").value = "";
                document.getElementById("author").value = "";
                document.getElementById("year").value = "";
                document.getElementById("isRead").checked = false;
                loadBooks();
            } catch (error) {
                showMessage("Error adding book", true);
            }
        }

        // save edited book
        async function saveEdit(id) {
            const title = document.getElementById(`edit-title-${id}`).value.trim();
            const author = document.getElementById(`edit-author-${id}`).value.trim();
            const year = parseInt(document.getElementById(`edit-year-${id}`).value);
            const isRead = document.getElementById(`edit-isRead-${id}`).checked;

            if (!title || !author || !year) {
                showMessage("Please fill in all fields", true);
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, author, year, isRead })
                });

                if (!response.ok) throw new Error("Could not update book");
                showMessage("Book updated! 🌸");
                loadBooks();
            } catch (error) {
                showMessage("Error updating book", true);
            }
        }

        // delete a book
        async function deleteBook(id) {
            if (!confirm("Are you sure you want to delete this book?")) return;

            try {
                const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
                if (!response.ok) throw new Error("Could not delete book");
                showMessage("Book deleted!");
                loadBooks();
            } catch (error) {
                showMessage("Error deleting book", true);
            }
        }

        // load books when page opens
        loadBooks();
    </script>

</body>
</html>
