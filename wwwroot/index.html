<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff5f0;
            font-family: 'Segoe UI', sans-serif;
            color: #5a3e36;
            background-image: radial-gradient(circle, #ffd6c8 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* smaller header */
        header {
            background: linear-gradient(135deg, #f4a58a, #e8c4e0);
            padding: 16px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 12px rgba(244, 165, 138, 0.3);
        }

            header h1 {
                font-size: 1.6rem;
                color: white;
                text-shadow: 1px 2px 4px rgba(0,0,0,0.1);
            }

            header p {
                color: #fff5f2;
                margin-top: 2px;
                font-size: 0.85rem;
            }

        main {
            max-width: 860px;
            margin: 20px auto;
            padding: 0 16px;
        }

        /* feedback message */
        #message {
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            font-weight: bold;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-success {
            background-color: #d4f4c8;
            color: #3a7a2a;
        }

        .msg-error {
            background-color: #fdd;
            color: #a00;
        }

        /* add book form */
        .form-section {
            background: linear-gradient(135deg, #ffe8df, #f5e0f7);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(244, 165, 138, 0.2);
            border: 2px dashed #f4b8a5;
        }

            .form-section h2 {
                margin-bottom: 14px;
                color: #c4607a;
                font-size: 1.2rem;
            }

            .form-section input[type="text"],
            .form-section input[type="number"] {
                width: 100%;
                padding: 10px 14px;
                margin-bottom: 10px;
                border: 2px solid #f4b8a5;
                border-radius: 12px;
                font-size: 0.95rem;
                background-color: white;
                outline: none;
                transition: border 0.2s;
            }

            .form-section input:focus {
                border-color: #e87aa0;
            }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

            .checkbox-row input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #e87aa0;
                cursor: pointer;
            }

            .checkbox-row label {
                font-size: 0.95rem;
                color: #a06070;
                cursor: pointer;
            }

        /* dominant add button */
        .btn-add {
            width: 100%;
            background: linear-gradient(135deg, #e87aa0, #f4a58a);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: bold;
            box-shadow: 0 6px 18px rgba(232, 122, 160, 0.45);
            transition: transform 0.15s, box-shadow 0.15s;
            letter-spacing: 0.5px;
        }

            .btn-add:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 22px rgba(232, 122, 160, 0.55);
            }

            .btn-add:active {
                transform: scale(0.98);
            }

        /* search and filter */
        .search-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

            .search-filter input {
                flex: 1;
                min-width: 160px;
                padding: 10px 14px;
                border: 2px solid #f4b8a5;
                border-radius: 12px;
                font-size: 0.95rem;
                outline: none;
                background: white;
                transition: border 0.2s;
            }

                .search-filter input:focus {
                    border-color: #e87aa0;
                }

            .search-filter select {
                padding: 10px 14px;
                border: 2px solid #f4b8a5;
                border-radius: 12px;
                font-size: 0.95rem;
                outline: none;
                background: white;
                color: #5a3e36;
                cursor: pointer;
            }

        /* book list */
        .books-section h2 {
            color: #c4607a;
            margin-bottom: 6px;
            font-size: 1.2rem;
        }

        .book-count {
            font-size: 0.85rem;
            color: #c4a0a0;
            margin-bottom: 14px;
        }

        /* book card with hover animation */
        .book-card {
            background: white;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 12px;
            box-shadow: 0 3px 10px rgba(244, 165, 138, 0.15);
            border-left: 5px solid #f4a58a;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(244, 165, 138, 0.3);
        }

        .book-card-view {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .book-info {
            flex: 1;
        }

            /* prominent book title */
            .book-info h3 {
                font-size: 1.05rem;
                color: #c4607a;
                font-weight: 700;
                margin-bottom: 3px;
            }

            .book-info p {
                font-size: 0.85rem;
                color: #a07060;
            }

        /* buttons close to content, responsive */
        .book-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-delete, .btn-edit {
            color: white;
            border: none;
            padding: 7px 13px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-delete {
            background: linear-gradient(135deg, #f4a58a, #e8826a);
        }

        .btn-edit {
            background: linear-gradient(135deg, #c9a8e0, #b08acc);
        }

            .btn-delete:hover, .btn-edit:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            }

        /* inline edit form */
        .edit-form {
            display: none;
            margin-top: 12px;
            border-top: 1px dashed #f4b8a5;
            padding-top: 12px;
        }

            .edit-form input[type="text"],
            .edit-form input[type="number"] {
                width: 100%;
                padding: 9px 13px;
                margin-bottom: 8px;
                border: 2px solid #f4b8a5;
                border-radius: 10px;
                font-size: 0.9rem;
                outline: none;
            }

            .edit-form input:focus {
                border-color: #e87aa0;
            }

            .edit-form .checkbox-row {
                margin-bottom: 10px;
            }

        .edit-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-save {
            background: linear-gradient(135deg, #a8e0b8, #70c490);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: transform 0.15s;
        }

            .btn-save:hover {
                transform: translateY(-1px);
            }

        .btn-cancel {
            background: #e0d0d0;
            color: #8a6060;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* empty state */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #c4a0a0;
        }

            .empty-state .empty-icon {
                font-size: 3rem;
                margin-bottom: 10px;
                animation: bounce 1.5s infinite;
            }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .empty-state p {
            font-size: 1rem;
            margin-bottom: 4px;
            color: #c4607a;
            font-weight: bold;
        }

        .empty-state span {
            font-size: 0.85rem;
        }

        footer {
            text-align: center;
            padding: 16px;
            color: #c4a0a0;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        /* responsive for mobile */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.3rem;
            }

            .book-card-view {
                flex-direction: column;
                align-items: flex-start;
            }

            .book-actions {
                margin-top: 8px;
                width: 100%;
            }

            .btn-delete, .btn-edit {
                flex: 1;
                text-align: center;
            }

            .search-filter {
                flex-direction: column;
            }

                .search-filter select {
                    width: 100%;
                }
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 My Book Library</h1>
        <p>Keep track of the books you love 🌸</p>
    </header>

    <main>

        <div id="message"></div>

        <!-- form to add a new book -->
        <div class="form-section">
            <h2>🌸 Add a new book</h2>
            <input type="text" id="title" placeholder="✏️ Title" />
            <input type="text" id="author" placeholder="👤 Author" />
            <input type="number" id="year" placeholder="📅 Year" />
            <div class="checkbox-row">
                <input type="checkbox" id="isRead" />
                <label for="isRead">⭐ I have read this book</label>
            </div>
            <button class="btn-add" onclick="addBook()">＋ Add Book 🌟</button>
        </div>

        <!-- search and filter -->
        <div class="books-section">
            <h2>🌈 All Books</h2>
            <p class="book-count" id="book-count"></p>

            <div class="search-filter">
                <input type="text" id="search" placeholder="🔍 Search by title or author..." oninput="filterBooks()" />
                <select id="filter" onchange="filterBooks()">
                    <option value="all">📚 All books</option>
                    <option value="read">⭐ Read</option>
                    <option value="notread">🌸 Not read yet</option>
                </select>
            </div>

            <div id="book-list"></div>
        </div>

    </main>

    <footer>
        Made with 🌸 and lots of books
    </footer>

    <script>
        const apiUrl = "http://localhost:5009/api/books";

        // store all books for filtering
        let allBooks = [];

        // show a message to the user
        function showMessage(text, isError = false) {
            const msg = document.getElementById("message");
            msg.textContent = text;
            msg.className = isError ? "msg-error" : "msg-success";
            msg.style.display = "block";
            setTimeout(() => msg.style.display = "none", 3000);
        }

        // load all books from the API
        async function loadBooks() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Could not load books");
                allBooks = await response.json();
                filterBooks();
            } catch (error) {
                showMessage("Error loading books", true);
            }
        }

        // filter books by search and read status
        function filterBooks() {
            const search = document.getElementById("search").value.toLowerCase();
            const filter = document.getElementById("filter").value;

            let filtered = allBooks.filter(book => {
                const matchesSearch = book.title.toLowerCase().includes(search) || book.author.toLowerCase().includes(search);
                const matchesFilter = filter === "all" || (filter === "read" && book.isRead) || (filter === "notread" && !book.isRead);
                return matchesSearch && matchesFilter;
            });

            displayBooks(filtered);
        }

        // show books in the DOM
        function displayBooks(books) {
            const list = document.getElementById("book-list");
            const count = document.getElementById("book-count");
            list.innerHTML = "";

            count.textContent = `You have ${allBooks.length} book${allBooks.length !== 1 ? "s" : ""} 📚`;

            if (books.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📖</div>
                            <p>No books yet.</p>
                            <span>Add your first one above!</span>
                        </div>`;
                return;
            }

            books.forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                        <div class="book-card-view">
                            <div class="book-info">
                                <h3>${book.title}</h3>
                                <p>${book.author} · ${book.year} · ${book.isRead ? "⭐ Read" : "🌸 Not read yet"}</p>
                            </div>
                            <div class="book-actions">
                                <button class="btn-edit" onclick="toggleEdit(${book.id})">✏️ Edit</button>
                                <button class="btn-delete" onclick="deleteBook(${book.id})">🗑️ Delete</button>
                            </div>
                        </div>
                        <div class="edit-form" id="edit-form-${book.id}">
                            <input type="text" id="edit-title-${book.id}" value="${book.title}" />
                            <input type="text" id="edit-author-${book.id}" value="${book.author}" />
                            <input type="number" id="edit-year-${book.id}" value="${book.year}" />
                            <div class="checkbox-row">
                                <input type="checkbox" id="edit-isRead-${book.id}" ${book.isRead ? "checked" : ""} />
                                <label for="edit-isRead-${book.id}">⭐ I have read this book</label>
                            </div>
                            <div class="edit-buttons">
                                <button class="btn-save" onclick="saveEdit(${book.id})">✅ Save</button>
                                <button class="btn-cancel" onclick="toggleEdit(${book.id})">Cancel</button>
                            </div>
                        </div>
                    `;
                list.appendChild(card);
            });
        }

        // show or hide edit form
        function toggleEdit(id) {
            const form = document.getElementById(`edit-form-${id}`);
            form.style.display = form.style.display === "block" ? "none" : "block";
        }

        // add a new book
        async function addBook() {
            const title = document.getElementById("title").value.trim();
            const author = document.getElementById("author").value.trim();
            const year = parseInt(document.getElementById("year").value);
            const isRead = document.getElementById("isRead").checked;

            if (!title || !author || !year) {
                showMessage("Please fill in all fields", true);
                return;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, author, year, isRead })
                });

                if (!response.ok) throw new Error("Could not add book");

                showMessage("Book added! 🌟");
                document.getElementById("title").value = "";
                document.getElementById("author").value = "";
                document.getElementById("year").value = "";
                document.getElementById("isRead").checked = false;
                loadBooks();
            } catch (error) {
                showMessage("Error adding book", true);
            }
        }

        // save edited book
        async function saveEdit(id) {
            const title = document.getElementById(`edit-title-${id}`).value.trim();
            const author = document.getElementById(`edit-author-${id}`).value.trim();
            const year = parseInt(document.getElementById(`edit-year-${id}`).value);
            const isRead = document.getElementById(`edit-isRead-${id}`).checked;

            if (!title || !author || !year) {
                showMessage("Please fill in all fields", true);
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, author, year, isRead })
                });

                if (!response.ok) throw new Error("Could not update book");
                showMessage("Book updated! 🌸");
                loadBooks();
            } catch (error) {
                showMessage("Error updating book", true);
            }
        }

        // delete a book
        async function deleteBook(id) {
            if (!confirm("Are you sure you want to delete this book?")) return;

            try {
                const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
                if (!response.ok) throw new Error("Could not delete book");
                showMessage("Book deleted!");
                loadBooks();
            } catch (error) {
                showMessage("Error deleting book", true);
            }
        }

        // load books when page opens
        loadBooks();
    </script>

</body>
</html>
